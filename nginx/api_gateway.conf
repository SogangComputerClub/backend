upstream node {
        server sgcc-node:3000;
}

upstream redoc {
        server sgcc-redoc:80;
}

server {
    listen 80;
    server_name api.sogangcomputerclub.org;  # Replace with your actual domain or IP

    # SSL configuration (uncomment when you have certificates)
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

        # Redirect /redoc to /redoc/ to ensure consistent handling.
    location = /redoc {
         return 301 /redoc/;
    }

    # Forward requests starting with /redoc/ to the redoc container (stripping the /redoc prefix)
    location /redoc/ {
         proxy_pass http://redoc/;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other requests go to the node service.
    location / {
         proxy_pass http://node/;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
    }
}